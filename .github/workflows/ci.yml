name: Carni CI

on:
  push:
    branches:
      - main
      - frontend
      - backend
      - pruebas
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Django (ruff + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the locked dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # config/settings_test.py: in-memory SQLite and made-up keys, no secret needed.
      - name: Run the test suite
        run: uv run python manage.py test

  frontend:
    name: Vite build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Node.js script syntax
        run: node --check app.js

      - name: Build frontend
        run: npm run build

      # The store's public pages are served by Django now; Vite builds only these.
      - name: Verify generated entrypoints
        run: |
          test -f dist/admin-customers.html
          test -f dist/admin-orders.html
          test -f dist/offline.html

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with its full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reviewed findings live in .gitleaksignore, each with its reason.
      - name: Scan the history
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --no-banner .
