[build]
  command = "npm run build"
  publish = "dist"
  functions = "functions"
  edge_functions = "edge-functions"

[build.environment]
  NODE_VERSION = "20.19.0"
  NPM_VERSION = "9.6.7"
  CI = "true"
  VITE_APP_VERSION = "1.0.0"

# Las variables VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY viven en el panel
# de Netlify (y en .env para local). No van aqui: netlify.toml pisa los valores
# del panel, y las plantillas que habia incrustaban una URL falsa en el bundle.

# Respaldo SPA: sin `force`, Netlify sirve primero los archivos que existen
# (/assets/*, *.html) y solo reescribe a index.html las rutas inexistentes.
# Con force=true devolvia index.html hasta para los JS/CSS y rompia toda la app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com;
      style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com;
      img-src 'self' data: https://api.qrserver.com https://maps.googleapis.com;
      font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net;
      connect-src 'self' https://wlikxgklwutxxazbhmkv.supabase.co https://api.open-meteo.com;
      frame-src 'self' https://www.google.com;
      worker-src 'self' blob:;
      manifest-src 'self';
    """

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[dev]
  framework = "#custom"
  command = "npm run dev"
  port = 3002
  target_port = 3002
  auto_launch = true
