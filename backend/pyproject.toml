[project]
name = "carni-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DJ", "SIM"]
